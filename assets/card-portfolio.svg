<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5;360 0.5 0.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Cube rotation path -->
    <style>
      @keyframes spin3d { from{transform:rotateY(0deg) rotateX(10deg)} to{transform:rotateY(360deg) rotateX(10deg)} }
      @keyframes nudge2 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>


  <rect x="0" y="0" width="580" height="300" rx="12" fill="url(#cardBg2)"/>

  <!-- Background halo -->
  <circle cx="430" cy="150" fill="#6366f1" opacity="0.07">
    <animate attributeName="r" values="90;120;90" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Project label -->
  <rect x="30" y="20" width="130" height="24" rx="12" fill="#1c2232" stroke="#30363d" stroke-width="1"/>
  <text x="95" y="36" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">🌐 PORTFOLIO SITE</text>

  <!-- Title -->
  <text x="30" y="80" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">3D Portfolio</text>
  <text x="30" y="105" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">React · Three.js · WebGL · Interactive</text>

  <!-- Description -->
  <text x="30" y="140" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">A personal portfolio with immersive</text>
  <text x="30" y="158" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">3D interactive elements and animations.</text>

  <!-- Animated Wireframe Cube (SVG isometric approximation) -->
  <g transform="translate(410, 170)">
    <!-- Rotating ring of dots to simulate 3D spin -->
    <animateTransform attributeName="transform" type="rotate" values="0 410 170;360 410 170" dur="10s" repeatCount="indefinite" additive="sum"/>

    <!-- Isometric cube faces using SVG paths -->
    <!-- Top face -->
    <polygon points="0,-45 38,-23 0,-1 -38,-23" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <!-- Right face -->
    <polygon points="0,-1 38,-23 38,21 0,43" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <!-- Left face -->
    <polygon points="0,-1 -38,-23 -38,21 0,43" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>

    <!-- Glowing center dot -->
    <circle cx="0" cy="0" r="3" fill="#6366f1">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles around cube -->
  <circle cx="380" cy="130" r="2" fill="#38bdf8" opacity="0.7">
    <animate attributeName="cy" values="130;120;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="455" cy="200" r="2" fill="#a78bfa" opacity="0.7">
    <animate attributeName="cy" values="200;190;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="140" r="1.5" fill="#6366f1" opacity="0.6">
    <animate attributeName="cy" values="140;130;140" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- CTA (link handled in README wrapper) -->
  <rect x="460" y="258" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="510" y="277" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">Visit →</text>
</svg>
