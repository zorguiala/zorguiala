<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="150" fill="url(#bg)"/>

  <!-- Wave A: purple -->
  <path fill="#a78bfa" opacity="0.18">
    <animate attributeName="d"
      values="M0,50 C200,90 400,10 600,50 C800,90 1000,10 1200,50 L1200,150 L0,150 Z;M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 L1200,150 L0,150 Z;M0,50 C200,90 400,10 600,50 C800,90 1000,10 1200,50 L1200,150 L0,150 Z"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Wave B: cyan -->
  <path fill="#22d3ee" opacity="0.14">
    <animate attributeName="d"
      values="M0,70 C150,30 350,110 600,70 C850,30 1050,110 1200,70 L1200,150 L0,150 Z;M0,90 C150,50 350,130 600,90 C850,50 1050,130 1200,90 L1200,150 L0,150 Z;M0,70 C150,30 350,110 600,70 C850,30 1050,110 1200,70 L1200,150 L0,150 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Wave C: indigo -->
  <path fill="#6366f1" opacity="0.12">
    <animate attributeName="d"
      values="M0,90 C300,50 600,130 900,90 C1050,70 1150,50 1200,90 L1200,150 L0,150 Z;M0,60 C300,100 600,40 900,80 C1050,100 1150,80 1200,60 L1200,150 L0,150 Z;M0,90 C300,50 600,130 900,90 C1050,70 1150,50 1200,90 L1200,150 L0,150 Z"
      dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Quote -->
  <text x="600" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#f0f6fc" text-anchor="middle" font-style="italic" opacity="0.85">"Every component started as a problem worth solving."</text>
  <text x="600" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">— Let's build something great together</text>
</svg>
