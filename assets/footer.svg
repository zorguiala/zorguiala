<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <!-- Animated wave path color -->
    <style>
      @keyframes morphA {
        0%   { d: path("M0,80 C200,120 400,40 600,80 C800,120 1000,40 1200,80 L1200,220 L0,220 Z"); }
        50%  { d: path("M0,100 C200,60 400,140 600,100 C800,60 1000,140 1200,100 L1200,220 L0,220 Z"); }
        100% { d: path("M0,80 C200,120 400,40 600,80 C800,120 1000,40 1200,80 L1200,220 L0,220 Z"); }
      }
      @keyframes morphB {
        0%   { d: path("M0,100 C150,60 350,140 600,100 C850,60 1050,140 1200,100 L1200,220 L0,220 Z"); }
        50%  { d: path("M0,120 C150,80 350,160 600,120 C850,80 1050,160 1200,120 L1200,220 L0,220 Z"); }
        100% { d: path("M0,100 C150,60 350,140 600,100 C850,60 1050,140 1200,100 L1200,220 L0,220 Z"); }
      }
      @keyframes morphC {
        0%   { d: path("M0,120 C300,80 600,160 900,120 C1050,100 1150,80 1200,120 L1200,220 L0,220 Z"); }
        50%  { d: path("M0,90 C300,130 600,70 900,110 C1050,130 1150,110 1200,90 L1200,220 L0,220 Z"); }
        100% { d: path("M0,120 C300,80 600,160 900,120 C1050,100 1150,80 1200,120 L1200,220 L0,220 Z"); }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Wave A: purple -->
  <path fill="#a78bfa" opacity="0.18" style="animation: morphA 7s ease-in-out infinite;">
    <animate attributeName="d"
      values="M0,80 C200,120 400,40 600,80 C800,120 1000,40 1200,80 L1200,220 L0,220 Z;M0,100 C200,60 400,140 600,100 C800,60 1000,140 1200,100 L1200,220 L0,220 Z;M0,80 C200,120 400,40 600,80 C800,120 1000,40 1200,80 L1200,220 L0,220 Z"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Wave B: cyan -->
  <path fill="#22d3ee" opacity="0.14" style="animation: morphB 9s ease-in-out infinite;">
    <animate attributeName="d"
      values="M0,100 C150,60 350,140 600,100 C850,60 1050,140 1200,100 L1200,220 L0,220 Z;M0,120 C150,80 350,160 600,120 C850,80 1050,160 1200,120 L1200,220 L0,220 Z;M0,100 C150,60 350,140 600,100 C850,60 1050,140 1200,100 L1200,220 L0,220 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Wave C: indigo -->
  <path fill="#6366f1" opacity="0.12" style="animation: morphC 11s ease-in-out infinite;">
    <animate attributeName="d"
      values="M0,120 C300,80 600,160 900,120 C1050,100 1150,80 1200,120 L1200,220 L0,220 Z;M0,90 C300,130 600,70 900,110 C1050,130 1150,110 1200,90 L1200,220 L0,220 Z;M0,120 C300,80 600,160 900,120 C1050,100 1150,80 1200,120 L1200,220 L0,220 Z"
      dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Center quote -->
  <text x="600" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#f0f6fc" text-anchor="middle" font-style="italic" opacity="0.8">"Every component started as a problem worth solving."</text>
  <text x="600" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">— Let's build something great together</text>

  <!-- Social icons as text badges -->
  <a href="https://www.linkedin.com/in/zorgui-alaeddine/">
    <rect x="380" y="140" width="120" height="34" rx="17" fill="#0a66c2" opacity="0.9"/>
    <text x="440" y="162" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">LinkedIn</text>
  </a>
  <a href="https://alaeddine.online/">
    <rect x="520" y="140" width="120" height="34" rx="17" fill="#7c3aed" opacity="0.9"/>
    <text x="580" y="162" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">Portfolio</text>
  </a>
  <a href="https://github.com/zorguiala">
    <rect x="660" y="140" width="120" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="720" y="162" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">GitHub</text>
  </a>
</svg>
