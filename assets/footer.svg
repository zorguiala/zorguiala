<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Wave A: purple -->
  <path fill="#a78bfa" opacity="0.18">
    <animate attributeName="d"
      values="M0,60 C200,100 400,20 600,60 C800,100 1000,20 1200,60 L1200,200 L0,200 Z;M0,80 C200,40 400,120 600,80 C800,40 1000,120 1200,80 L1200,200 L0,200 Z;M0,60 C200,100 400,20 600,60 C800,100 1000,20 1200,60 L1200,200 L0,200 Z"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Wave B: cyan -->
  <path fill="#22d3ee" opacity="0.14">
    <animate attributeName="d"
      values="M0,80 C150,40 350,120 600,80 C850,40 1050,120 1200,80 L1200,200 L0,200 Z;M0,100 C150,60 350,140 600,100 C850,60 1050,140 1200,100 L1200,200 L0,200 Z;M0,80 C150,40 350,120 600,80 C850,40 1050,120 1200,80 L1200,200 L0,200 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Wave C: indigo -->
  <path fill="#6366f1" opacity="0.12">
    <animate attributeName="d"
      values="M0,100 C300,60 600,140 900,100 C1050,80 1150,60 1200,100 L1200,200 L0,200 Z;M0,70 C300,110 600,50 900,90 C1050,110 1150,90 1200,70 L1200,200 L0,200 Z;M0,100 C300,60 600,140 900,100 C1050,80 1150,60 1200,100 L1200,200 L0,200 Z"
      dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Center quote -->
  <text x="600" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#f0f6fc" text-anchor="middle" font-style="italic" opacity="0.85">"Every component started as a problem worth solving."</text>
  <text x="600" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">— Let's build something great together</text>
</svg>
