<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <!-- Rotating gradient border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5;360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Packet path -->
    <path id="connPath" d="M 160,150 Q 290,80 420,150" fill="none"/>
    <style>
      @keyframes nodePulse { 0%,100%{opacity:0.5;r:8} 50%{opacity:1;r:11} }
      @keyframes livePin { 0%,100%{opacity:1;r:4} 50%{opacity:0.3;r:5} }
      @keyframes nudge { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Border glow (outer rect with animated gradient stroke) -->
  <rect x="1" y="1" width="578" height="298" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Card body -->
  <rect x="3" y="3" width="574" height="294" rx="11" fill="url(#cardBg)"/>

  <!-- Pulsing halo background -->
  <circle cx="420" cy="140" fill="#a78bfa" opacity="0.08">
    <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Live badge -->
  <circle cx="34" cy="30" fill="#3fb950">
    <animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="34" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7ee787" font-weight="600">LIVE PROJECT</text>

  <!-- Title -->
  <text x="30" y="80" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Odoo MCP Server</text>
  <text x="30" y="105" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Node.js · TypeScript · Model Context Protocol</text>

  <!-- Description -->
  <text x="30" y="140" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Connecting Odoo ERP to AI assistants</text>
  <text x="30" y="158" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">via natural-language queries.</text>

  <!-- === Animated diagram: AI ←→ ERP packet beam === -->
  <!-- AI node -->
  <circle cx="150" cy="220" fill="#161b22" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="r" values="22;26;22" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="225" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="700">AI</text>

  <!-- Connection arc -->
  <path d="M 175,220 Q 290,160 405,220" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Packet traveling along arc -->
  <circle r="6" fill="#22d3ee" opacity="0.9">
    <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#connPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Return packet -->
  <circle r="5" fill="#a78bfa" opacity="0.9">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#connPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ERP/Odoo node -->
  <circle cx="420" cy="220" fill="#161b22" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;26;22" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <text x="420" y="217" font-family="monospace" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="700">Odoo</text>
  <text x="420" y="228" font-family="monospace" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="700">ERP</text>

  <!-- CTA button -->
  <a href="https://github.com/zorguiala/Odoo-MCP">
    <rect x="460" y="258" width="100" height="30" rx="15" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="510" y="277" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle" style="animation: nudge 1.8s ease-in-out infinite;">View →</text>
  </a>
</svg>
